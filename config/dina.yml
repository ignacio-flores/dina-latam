project:
  name: dina-latam

countries:
  - COL
  - ARG
  - PER
  - URY
  - CRI
  - ECU
  - CHL
  - BRA
  - SLV
  - MEX
  - DOM

years:
  first: 2000
  last: 2023

run:
  lang: eng
  debug: false
  bfm_replace: false
  units:
    - ind
    - esn
    - pch
  steps:
    - natinc
    - pon

stata:
  command: "${DINA_STATA_CMD}"
  batch_args:
    - -b
    - do

paths:
  input_data: input_data
  intermediary_data: intermediary_data
  output: output
  previous_series: previous_series
  updates: output/updates
  run_logs: output/run_logs
  final_outputs:
    - output/latest_wid_series
    - output/data_reports
    - output/synthetic_microfiles

notifications:
  pushover:
    enabled: false
    token: "${PUSHOVER_APP_TOKEN}"
    user: "${PUSHOVER_USER_KEY}"

archives:
  default_dir: output/archives
  primary_paths:
    - input_data
    - previous_series

dependencies:
  r_packages:
    - cli
    - yaml
    - processx
    - fs
    - digest
    - jsonlite
    - pushoverr
    - testthat
    - withr
    - readxl
    - openxlsx
