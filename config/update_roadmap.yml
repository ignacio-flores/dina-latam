gates:
  - id: parameters
    label: Update parameters
    goal: Confirm update year, countries, run options, and export comparison settings.
    source_families: []
    tasks: []
    old_refs:
      - Preliminary: include new last year in _config.do.
      - Export: update last year and previous-series date.
    checks:
      - id: year-scope
        label: Global output year and country list reviewed.
      - id: export-settings
        label: Previous-series date and export comparison settings reviewed.
      - id: config-rendered
        label: Session config rendered and checked.
    commands:
      - dina config show
      - dina config render

  - id: macro-sna
    label: National accounts and macro SNA
    goal: Refresh/review UN SNA, WID macro dependencies, balance sheets, social security, and country SNA.
    source_families:
      - macro_sna
      - country_sna
      - wid
      - balance_sheet
      - social_security
    tasks:
      - 01a-clean-macro-data
      - 01b-add-country-sna
    old_refs:
      - Country-specific National Accounts.
      - If SNA format changed, adapt 01b and run.
    checks:
      - id: source-urls-reviewed
        label: SNA URLs and country website index reviewed.
      - id: files-integrated
        label: New SNA files integrated into canonical input paths.
      - id: parser-format-reviewed
        label: Country SNA parser ranges/sheets reviewed.
      - id: tasks-run
        label: 01a and 01b run or intentionally deferred.
    commands:
      - dina sources list family sna --urls
      - dina run 01a,01b --dry-run

  - id: surveys
    label: Surveys, prices, and population inputs
    goal: Review CEPAL surveys, Argentina CPI, survey population inputs, and Brazil survey adjustment parameters.
    source_families:
      - surveys
      - prices
      - population
    tasks:
      - 01e-clean-survey-data
      - 01f-adjust-country-survey-data
      - 02a-get-survey-populations
    old_refs:
      - CEPAL Surveys input_data/surveys_CEPAL.
      - Update Argentina CPI and Brazil survey adjustment parameters.
    checks:
      - id: survey-files-reviewed
        label: New or updated survey files reviewed.
      - id: argentina-cpi-reviewed
        label: Argentina CPI input reviewed when relevant.
      - id: brazil-adjustments-reviewed
        label: Brazil minimum wage, INSS, and DIRPF survey parameters reviewed.
      - id: tasks-run
        label: 01e, 01f, and 02a run or intentionally deferred.
    commands:
      - dina sources list family surveys --urls
      - dina run 01e,01f,02a --dry-run

  - id: tax-admin
    label: Admin tax microdata and GPInter
    goal: Accept admin tax inputs, validate parser assumptions, rebuild clean files, and prepare GPInter inputs.
    source_families:
      - admin_tax
      - admin_tax_aux
    tasks:
      - 02b-prepare-admin-microdata
      - 02c-prepare-static-admin-data
      - 02d-prepare-updated-admin-data
      - 02e-format-for-bfm
    old_refs:
      - Tax data manual downloads from Data/Tax-Data/website-index.ods.
      - Old note mentions 01g for tax/admin; current tasks are 02b-02e.
      - Apply GPInter and update input_data/admin_data/directory.xlsx trustable spans.
    checks:
      - id: raw-accepted
        label: Raw admin files accepted from _new inbox or canonical paths.
      - id: structure-validated
        label: CHL/COL/BRA file structure validated.
      - id: parser-code-reviewed
        label: Parser/code changes reviewed for format or year changes.
      - id: cleaners-run
        label: 02d updated admin cleaners run or intentionally deferred.
      - id: clean-outputs-reviewed
        label: _clean outputs reviewed.
      - id: gpinter-reviewed
        label: GPInter files and 02e formatting reviewed.
      - id: directory-reviewed
        label: directory.xlsx and trustable spans reviewed.
      - id: effective-tax-inputs-reviewed
        label: Effective-tax-rate inputs reviewed before downstream tax tasks.
    commands:
      - dina sources review
      - dina sources integrate --incoming --source chl-pit-total
      - dina run 02d --dry-run
      - dina run 02e --dry-run

  - id: tax-rates
    label: Tax composition and effective rates
    goal: Review OECD-CIAT-CEPAL tax composition and effective-tax-rate country inputs.
    source_families:
      - tax_composition
      - admin_tax_aux
    tasks:
      - 01c-import-tax-composition
      - 04a-compute-effective-rates
    old_refs:
      - Check if OECD-CIAT-CEPAL tax data has updated beyond 2022.
      - Update effective-tax-rate country loops when needed.
    checks:
      - id: composition-reviewed
        label: OECD-CIAT-CEPAL composition source reviewed.
      - id: country-rate-inputs-reviewed
        label: Country effective-tax-rate inputs and loops reviewed.
      - id: tasks-run
        label: 01c and 04a run or intentionally deferred.
    commands:
      - dina sources list family tax-composition --urls
      - dina run 01c,04a --dry-run

  - id: spending
    label: Public spending
    goal: Review public spending sources and rebuild spending figures after macro SNA exists.
    source_families:
      - public_spending
      - wid
    tasks:
      - 01g-add-public-spending-data
    old_refs:
      - Spending data: run 01g in update mode, save local file, then switch back to local mode.
    checks:
      - id: spending-source-reviewed
        label: Spending source and local/WID refresh choice reviewed.
      - id: task-run
        label: 01g run or intentionally deferred.
    commands:
      - dina run 01g --dry-run

  - id: bfm
    label: BFM and correction preparation
    goal: Validate survey/admin overlap and build BFM, two-stage, and theta correction inputs.
    source_families: []
    tasks:
      - 03a-run-bfm
      - 03b-run-bfm-2stage
      - 03d-prepare-theta-extrapolation
      - 03e-extrapolate-bfm-correction
    old_refs:
      - Average values extrapolate SNA scaling factors.
      - Theta coefficients are extrapolated from the closest available year.
    checks:
      - id: inputs-reviewed
        label: Survey and admin inputs reviewed for BFM.
      - id: tasks-run
        label: 03a, 03b, 03d, and 03e run or intentionally deferred.
    commands:
      - dina run 03 --dry-run

  - id: imputation
    label: Pretax/posttax construction and imputation
    goal: Build pretax/posttax units, compare SNA totals, rescale, and impute final microdata.
    source_families: []
    tasks:
      - 04b-build-pretax-surveys
      - 04c-create-raw-postax-units
      - 05a-compare-sna-totals
      - 05b-rescale-and-impute
      - 05c-impute-pretax
      - 05d-impute-posttax
    old_refs:
      - Review SNA scaling and imputation assumptions before final statistics.
    checks:
      - id: tax-survey-inputs-reviewed
        label: Pretax/posttax inputs reviewed.
      - id: tasks-run
        label: 04b, 04c, and 05a-05d run or intentionally deferred.
    commands:
      - dina run --from 04b --to 05d --dry-run

  - id: export-validation
    label: Statistics, validation, and export
    goal: Produce inequality statistics, availability reports, interpolation, prior-series comparison, and WID export.
    source_families:
      - previous_series
    tasks:
      - 06a-run-ineqstats
      - 06b-graph-ineqstats-countries
      - 07a-export-synthetic-microfiles
      - 07b-report-data-availability
      - 07c-interpolate-ineqstats
      - 07d-export-results-to-wid
    old_refs:
      - Export: update last year and previous-series date twice when needed.
    checks:
      - id: stats-reviewed
        label: Inequality statistics and figures reviewed.
      - id: availability-reviewed
        label: Data availability report reviewed.
      - id: interpolation-reviewed
        label: Interpolation outputs and errors reviewed.
      - id: wid-export-reviewed
        label: WID export compared with previous series.
    commands:
      - dina run --from 06 --to 07 --dry-run
      - dina update finalize
