version: 1
name: admin_pit_include_contract
description: >
  PIT Admin include contract. Dry-run stages incoming PIT sources and their
  formatted interpolation-ready outputs. Include promotes the complete
  reviewed handoff for pipeline consumption.

output_root: output/experiments/admin_pit_include
explore_output_root: output/experiments/admin_pit_explore

years:
  from_config: config/dina.yml
  use_active_update_override: true

source_ids:
  - chl-pit
  - bra-pit
  - col-pit

statuses:
  clean:
    - ok_source_staged
  warnings:
    - warning_structure_review
    - warning_static_dependency_carried_forward
    - warning_aux_dependency_carried_forward
    - warning_aux_dependency_legacy
  blocked:
    - blocked_structure_mismatch
    - blocked_destination_missing
    - blocked_missing_incoming_source
    - blocked_static_dependency_missing
    - blocked_aux_dependency_missing
    - blocked_cleaner_failed
    - blocked_clean_output_missing

fingerprints:
  require_sha256: true
  compare:
    - kind
    - sha256

cleaners:
  contract_version: 1
  mode: real
  review_harmonized_outputs:
    description: >
      Compare accepted and incoming PIT sources after their country cleaner has
      produced the bracket inputs used by interpolation. Raw publisher cells
      are not compared directly.
    # Thresholds are the published bracket boundaries. They remain stable when
    # the cleaner recomputes percentile positions from a revised population
    # total, so use them to align equivalent interpolation-ready brackets.
    bracket_keys: [country, source_id, year, component, thr]
    # p is a derived interpolation coordinate, not a PIT value. The review's
    # value-change table therefore focuses on the published bracket average.
    bracket_values: [bracketavg]
    annual_keys: [country, source_id, year, component]
    annual_values: [average, popsize]
  expected_outputs:
    chl-pit:
      - input_data/admin_data/CHL/_clean/total-pre-CHL.xlsx
      - input_data/admin_data/CHL/_clean/total-pos-CHL.xlsx
    bra-pit:
      - input_data/admin_data/BRA/_clean/total-pre-BRA.xlsx
    col-pit:
      - input_data/admin_data/COL/_clean/total-pos-COL.xlsx
  static_dependencies:
    chl-pit:
      - intermediary_data/population/SurveyPop.dta
      - input_data/wid/population_total_adult_npopul.dta
      - input_data/admin_data/CHL/tab_gc_1991_2000.xls
      - input_data/admin_data/CHL/tab_gc_1963_1981.xlsx
      - input_data/admin_data/CHL/tab_gc_1998_2009.xlsx
      - input_data/admin_data/CHL/tab_gc_wage_1998_2009.xlsx
      - input_data/admin_data/CHL/Data_1998-2009sinKG.xlsx
    bra-pit:
      - intermediary_data/population/SurveyPop.dta
      - input_data/admin_data/BRA/ptot_*.xlsx
  auxiliary_sources:
    chl-pit:
      - chl-uta
    bra-pit:
      - bra-minwage
      - bra-admin-thresholds
  # These are reviewed separately from the harmonized PIT brackets.  Every
  # auxiliary input used by a current PIT cleaner needs an explicit reviewer
  # label, so a newly added dependency cannot disappear from the normal review.
  review_other_inputs:
    chl-uta:
      label: UTA index
    bra-minwage:
      label: Minimum wage
    bra-admin-thresholds:
      label: Tax and social-security thresholds
