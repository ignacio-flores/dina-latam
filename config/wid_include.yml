artifacts:
  population:
    canonical: input_data/wid/population_total_adult_npopul.dta
    raw: input_data/wid/raw_population_npopul_ages_999_992.dta
    type: population_total_adult
    output_map:
      totalpop: npopul999i
      adultpop: npopul992i
    request:
      indicators: [npopul]
      area_set: population_legacy
      ages: ["999", "992"]
      pop: i
      first_year: 1990
    schema:
      required_columns: [country, region, year, totalpop, adultpop]
      key_columns: [country, year]
      numeric_columns: [totalpop, adultpop]
      required_years: config
  wid-macro:
    canonical: input_data/wid/macro_national_accounts_indicators.dta
    raw: input_data/wid/raw_macro_national_accounts_indicators_ages_999_992.dta
    type: raw_subset
    request:
      indicators: [mnninc, mgdpro, mnnfin, mptfrr, mptfrp, inyixx, npopul, mccshn, mccmhn, mcfcco, mconfc, mptfhr, mgsmhn, mgsrhn, mgmxhn, mprgco, agninc]
      area_set: project_latam
      ages: ["999", "992"]
      first_year: 1990
    schema:
      required_columns: [country, variable, year, value]
      key_columns: [country, variable, year]
      numeric_columns: [value]
      required_years: config
  wid-public-spending:
    canonical: input_data/wid/public_spending_gdp_shares.dta
    raw: input_data/wid/raw_public_spending_indicators.dta
    type: public_spending_gdp_shares
    output_map:
      denominator: mgdpro
      shares:
        con: mcongo
        edu: meduge
        exp: mexpgo
        hea: mheage
      source: WID_web
    derive:
      min_year: 2000
    request:
      indicators: [meduge, mheage, mexpgo, mcongo, mgdpro]
      area_set: project_latam
      first_year: 1990
    schema:
      required_columns: [iso, year, source, exp, con, hea, edu]
      key_columns: [iso, year]
      numeric_columns: [exp, con, hea, edu]
      required_years: configured_window
  wid-prices-xrates:
    canonical: input_data/wid/prices_deflator_ppp_eur.dta
    raw: input_data/wid/raw_prices_inyixx_xlceup.dta
    type: prices_deflator_ppp
    output_map:
      defl_xxxx: inyixx
      xppp_eur: xlceup
    request:
      indicators: [inyixx, xlceup]
      area_set: project_latam
      first_year: 1990
    schema:
      required_columns: [country, countrycode, year, defl_xxxx, xppp_eur]
      key_columns: [country, year]
      numeric_columns: [defl_xxxx, xppp_eur]
      required_years: configured_window
  wid-export-scaling:
    canonical: input_data/wid/export_scaling_anninc_xrates.dta
    raw: input_data/wid/raw_export_anninc_xlceup_xlceux_p0p100.dta
    type: export_scaling
    output_map:
      anninc992i: [anninc992]
      nninc_lcu_constc: [anninc999, anninc]
      ppp_eur: [xlceup]
      mer_eur: [xlceux]
    request:
      indicators: [anninc, xlceup, xlceux]
      area_set: export_countries
      perc: [p0p100]
      first_year: 1990
    schema:
      required_columns: [iso, year, anninc992i, nninc_lcu_constc, ppp_eur, mer_eur]
      key_columns: [iso, year]
      numeric_columns: [anninc992i, nninc_lcu_constc, ppp_eur, mer_eur]
      required_years: configured_window
  wid-export-sptinc-check:
    canonical: input_data/wid/export_comparison_sptinc_p0p20.dta
    raw: input_data/wid/raw_export_sptinc_p0p20_age_992.dta
    type: export_sptinc_check
    output_map:
      country: country
      year: year
      widcode: variable
      p: percentile
      value_web: value
    derive:
      min_year: 2000
    request:
      indicators: [sptinc]
      area_set: export_countries
      perc: [p0p20]
      ages: ["992"]
      first_year: 2000
    schema:
      required_columns: [country, year, widcode, p, value_web]
      key_columns: [country, year, widcode, p]
      numeric_columns: [value_web]
      required_years: configured_window
statuses:
  blocked:
    - blocked_fetch_failed
    - blocked_read_failed
    - blocked_schema
    - blocked_empty_source
    - blocked_duplicate_keys
    - blocked_missing_values
    - blocked_missing_required_years
    - blocked_derivation_failed
    - blocked_copy_failed
