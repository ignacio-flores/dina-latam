tasks:
  - id: 01a-clean-macro-data
    stage: macro
    type: stata
    script: code/Stata/01a-clean-macro-data.do
    deps: []
    inputs:
      - input_data/sna_UNDATA/_clean
      - input_data/balance_sheet
      - input_data/wid/macro_national_accounts_indicators.dta
    outputs:
      - intermediary_data/national_accounts/UNDATA-WID-OECD-Merged.dta

  - id: 01b-add-country-sna
    stage: macro
    type: stata
    script: code/Stata/01b-add-country-sna.do
    deps:
      - 01a-clean-macro-data
    inputs:
      - input_data/sna_country_data
      - input_data/sna_country_data/DOM/cei.xlsx
      - intermediary_data/national_accounts/UNDATA-WID-Merged.dta
      - code/R/01b_prepare_annual_sna.R
      - code/R/source-diagnostics/country_sna_include.R
      - config/country_sna_include.yml
    outputs:
      - intermediary_data/national_accounts/UNDATA-WID-Merged.dta
      - intermediary_data/national_accounts/sna_country_data/URY/cei.xlsx
      - intermediary_data/national_accounts/sna_country_data/PER/cei.xlsx
      - output/figures/cei

  - id: 01c-import-tax-composition
    stage: macro
    type: stata
    script: code/Stata/01c-import-tax-composition.do
    deps:
      - 01a-clean-macro-data
    inputs:
      - input_data/OECD-CIAT-CEPAL/tot_tax_pct_gdp_2024.csv
    outputs:
      - output/figures/total-taxes

  - id: 01d-import-ceq-data
    stage: ceq
    type: stata
    script: code/Stata/01d-import_ceq_data.do
    deps: []
    inputs:
      - input_data/CEQ
    outputs:
      - output/data_reports/ceq_data_availability.xlsx

  - id: 01e-clean-survey-data
    stage: surveys
    type: stata
    script: code/Stata/01e-clean-survey-data.do
    deps: []
    inputs:
      - input_data/surveys_CEPAL
      - input_data/admin_data/BRA/downloads/wiki_minwage.csv
      - input_data/admin_data/BRA/downloads/admin_thresholds.csv
    outputs:
      - intermediary_data/microdata/raw

  - id: 01f-adjust-country-survey-data
    stage: surveys
    type: stata
    script: code/Stata/01f-adjust-country-survey-data.do
    deps:
      - 01e-clean-survey-data
    inputs:
      - intermediary_data/microdata/raw
      - input_data/wid/population_total_adult_npopul.dta
      - input_data/admin_data/BRA/downloads/wiki_minwage.csv
      - input_data/admin_data/BRA/downloads/admin_thresholds.csv
    outputs:
      - intermediary_data/microdata/adjusted

  - id: 01g-add-public-spending-data
    stage: macro
    type: stata
    script: code/Stata/01g-add-public-spending-data.do
    deps:
      - 01c-import-tax-composition
    inputs:
      - input_data/expenditure_durrer_gethin_fisherpost
      - input_data/wid/public_spending_gdp_shares.dta
      - intermediary_data/national_accounts/UNDATA-WID-OECD-Merged.dta
    outputs:
      - output/figures/spending

  - id: 02a-get-survey-populations
    stage: preparation
    type: stata
    active: false
    script: code/Stata/02a-get-survey-populations.do
    deps: []
    inputs:
      - input_data/surveys_CEPAL
      - code/R/old/02a_get_survey_populations.R
    outputs:
      - intermediary_data/population/SurveyPop.dta
    notes:
      - Retired from the active pipeline. SurveyPop.dta is produced by `dina sources include surveys --confirm`.

  - id: 02b-prepare-admin-microdata
    stage: admin
    type: stata
    active: false
    script: code/Stata/02b-prepare-admin-microdata.do
    deps: []
    inputs:
      - input_data/admin_data/MEX
      - input_data/admin_data/URY
      - input_data/wid/population_total_adult_npopul.dta
      - intermediary_data/population/SurveyPop.dta
    outputs:
      - input_data/admin_data/MEX/_clean
      - input_data/admin_data/URY/_clean
    notes:
      - Heavy static admin-database preparation. Inactive by default because these inputs rarely change.

  - id: 02c-prepare-static-admin-data
    stage: admin
    type: stata
    script: code/Stata/02c-prepare-static-admin-data.do
    deps: []
    inputs:
      - input_data/admin_data
      - input_data/wid/population_total_adult_npopul.dta
      - intermediary_data/population/SurveyPop.dta
    outputs:
      - input_data/admin_data/*/_clean

  - id: 02d-prepare-updated-admin-data
    stage: admin
    type: stata
    script: code/Stata/02d-prepare-updated-admin-data.do
    deps: []
    inputs:
      - input_data/admin_data/CHL
      - input_data/admin_data/BRA
      - input_data/admin_data/COL
    outputs:
      - input_data/admin_data/CHL/_clean
      - input_data/admin_data/BRA/_clean
      - input_data/admin_data/COL/_clean

  - id: 02d5-interpolate-admin-data
    stage: admin
    type: r
    script: code/R/02d5_interpolate_admin_data.R
    deps:
      - 02c-prepare-static-admin-data
      - 02d-prepare-updated-admin-data
    inputs:
      - code/R/admin_cleaners/gpinter_admin.R
      - config/admin_gpinter.yml
    outputs:
      - output/data_reports/admin_gpinter_manifest.json
      - output/data_reports/admin_gpinter_countries.csv
      - input_data/admin_data/SLV/gpinter_output/total-pos-SLV.xlsx
      - input_data/admin_data/PER/gpinter_output/total-pos-PER.xlsx
      - input_data/admin_data/DOM/gpinter_output/total-pos-DOM.xlsx
      - input_data/admin_data/DOM/gpinter_output/total-pre-DOM.xlsx
      - input_data/admin_data/BRA/gpinter_output/total-pre-BRA.xlsx
      - input_data/admin_data/CHL/gpinter_output/total-pos-CHL.xlsx
      - input_data/admin_data/CHL/gpinter_output/total-pre-CHL.xlsx
      - input_data/admin_data/COL/gpinter_output/total-pos-COL.xlsx
    notes:
      - Runs the local gpinter R package on each selected country's _clean Admin tabulation.

  - id: 02e-format-for-bfm
    stage: admin
    type: stata
    script: code/Stata/02e-format-for-bfm.do
    deps:
      - 02d5-interpolate-admin-data
    inputs:
      - input_data/admin_data/URY/gpinter_URY_*.xlsx
      - output/data_reports/admin_gpinter_manifest.json
      - output/data_reports/admin_gpinter_countries.csv
    outputs:
      - input_data/admin_data/SLV/gpinter_SLV_*.xlsx
      - input_data/admin_data/PER/gpinter_PER_*.xlsx
      - input_data/admin_data/DOM/gpinter_DOM_*.xlsx
      - input_data/admin_data/BRA/gpinter_BRA_*.xlsx
      - input_data/admin_data/CHL/gpinter_CHL_*.xlsx
      - input_data/admin_data/COL/gpinter_COL_*.xlsx

  - id: 03a-run-bfm
    country_scope: selected
    country_applicability: [COL, URY, BRA, DOM, SLV, ECU, PER, CHL]
    stage: bfm
    type: stata
    script: code/Stata/03a-run-bfm.do
    deps:
      - 01f-adjust-country-survey-data
      - 02e-format-for-bfm
    inputs:
      - intermediary_data/microdata/raw
      - input_data/admin_data
      - input_data/admin_data/ECU/gpinter_ECU_2008.xlsx
      - input_data/admin_data/ECU/gpinter_ECU_2009.xlsx
      - input_data/admin_data/ECU/gpinter_ECU_2010.xlsx
      - input_data/admin_data/ECU/gpinter_ECU_2011.xlsx
    outputs:
      - intermediary_data/microdata/bfm_norep_pre
      - output/bfm_summary
      - output/bfm_summary/observed_donors
    notes:
      - Uses historical BFM-ready ECU workbooks until the replacement Admin data is included.

  - id: 03b-run-bfm-2stage
    country_scope: selected
    country_applicability: [ARG, CRI, MEX]
    stage: bfm
    type: stata
    script: code/Stata/03b-run-bfm-2stage.do
    deps:
      - 03a-run-bfm
    inputs:
      - intermediary_data/microdata/bfm_norep_pre
      - input_data/admin_data/MEX/wage_MEX_2010.xlsx
      - input_data/admin_data/MEX/wage_MEX_2012.xlsx
      - input_data/admin_data/MEX/wage_MEX_2014.xlsx
    outputs:
      - intermediary_data/microdata/bfm_norep_pos
      - output/bfm_summary/observed_donors
    notes:
      - Uses historical MEX wage tabulations instead of rebuilding heavy tax microdata.

  - id: 03c-graph-thetas
    country_scope: shared
    stage: bfm
    type: stata
    script: code/Stata/03c-graph-thetas.do
    deps:
      - "03a-run-bfm"
      - "03b-run-bfm-2stage"
    inputs:
      - "output/bfm_summary/bfm_norep_pos/merging_points.xlsx"
      - "output/bfm_summary/bfm_norep_pre/merging_points.xlsx"
    outputs:
      - output/bfm_summary/all_thetas.xlsx
      - output/bfm_summary/03c_validation.json
      - output/figures/thetas

  - id: 03d-prepare-theta-extrapolation
    country_scope: selected
    stage: bfm
    type: stata
    script: code/Stata/03d-prepare-theta-extrapolation.do
    deps:
      - "03a-run-bfm"
      - "03b-run-bfm-2stage"
      - "03c-graph-thetas"
      - "01e-clean-survey-data"
      - "01f-adjust-country-survey-data"
    inputs:
      - "output/bfm_summary/all_thetas.xlsx"
      - "output/bfm_summary/03c_validation.json"
      - "intermediary_data/microdata/raw"
      - "output/bfm_summary/observed_donors"
      - "config/theta_extrapolation_policy.csv"
    outputs:
      - "output/bfm_summary/pseudo_thetas.xlsx"
      - "intermediary_data/weight_adjusters/index.xlsx"
      - "intermediary_data/weight_adjusters/*.xlsx"
      - "output/figures/pthetas"

  - id: 03e-extrapolate-bfm-correction
    country_scope: selected
    stage: bfm
    type: stata
    script: code/Stata/03e-extrapolate-bfm-correction.do
    deps:
      - "03c-graph-thetas"
      - "03d-prepare-theta-extrapolation"
      - "01e-clean-survey-data"
      - "01f-adjust-country-survey-data"
    inputs:
      - "intermediary_data/microdata/raw"
      - "output/bfm_summary/all_thetas.xlsx"
      - "output/bfm_summary/03c_validation.json"
      - "intermediary_data/weight_adjusters/index.xlsx"
      - "intermediary_data/weight_adjusters/[A-Z][A-Z][A-Z]*.xlsx"
    outputs:
      - "intermediary_data/microdata/bfm_norep_pre"
      - "intermediary_data/microdata/bfm_norep_pos"
      - "output/bfm_summary/bfm_norep_pre/merging_points.xlsx"
      - "output/bfm_summary/bfm_norep_pre/bfm_summary_[A-Z][A-Z][A-Z]_extrap.xlsx"
      - "output/bfm_summary/bfm_norep_pos/merging_points.xlsx"
      - "output/bfm_summary/bfm_norep_pos/bfm_summary_[A-Z][A-Z][A-Z]_extrap.xlsx"
      - "intermediary_data/weight_adjusters/index.xlsx"
      - "output/figures/MP"

  - id: 04a0-prepare-bra-rate-points
    country_scope: selected
    country_applicability: [BRA]
    stage: taxes
    type: r
    script: code/R/04a0_prepare_bra_rate_points.R
    deps:
      - 02d5-interpolate-admin-data
    inputs:
      - input_data/admin_data/BRA/gn-irpf-ac*.xlsx
    outputs:
      - intermediary_data/tax_rates/BRA/eff-tax-rates-BRA.xlsx
      - intermediary_data/tax_rates/BRA/eff-tax-rates-BRA_manifest.csv
    notes:
      - Builds BRA effective PIT rate anchors directly from the publisher tables.

  - id: 04a-compute-effective-rates
    country_scope: selected
    country_applicability: [COL, BRA, MEX, CRI, CHL, SLV, ECU, URY, PER, DOM]
    stage: taxes
    type: stata
    script: code/Stata/04a-compute-effective-rates-all.do
    deps:
      - 02e-format-for-bfm
      - 04a0-prepare-bra-rate-points
    inputs:
      - input_data/admin_data
      - input_data/admin_data/MEX/gpinter_MEX_2009.xlsx
      - input_data/admin_data/CHL/gpinter_output/total-pre-CHL.xlsx
      - intermediary_data/tax_rates/BRA/eff-tax-rates-BRA.xlsx
    outputs:
      - output/efftax

  - id: 04a5-generate-arg-rates
    country_scope: selected
    country_applicability: [ARG]
    stage: taxes
    type: r
    script: code/R/04a_generate_arg_rates.R
    deps:
      - 04a-compute-effective-rates
    inputs:
      - code/R/admin_cleaners/gpinter_admin.R
      - input_data/admin_data/ARG/EstadisticasTributarias*/tabulation_*.dta
      - input_data/admin_data/ARG/EstadisticasTributarias*/2.2.2.1.11.dta
      - input_data/admin_data/ARG/EstadisticasTributarias2009/2.2.2.1.11.xlsx
    outputs:
      - input_data/admin_data/ARG/eff-tax-rate/ARG_rates_manifest.csv
    notes:
      - Rebuilds ARG yearly effective PIT rates with the local gpinter R package.

  - id: 04b-build-pretax-surveys
    country_scope: selected
    stage: taxes
    type: stata
    script: code/Stata/04b-build-pretax-surveys.do
    deps:
      - 03a-run-bfm
      - 04a-compute-effective-rates
      - 04a5-generate-arg-rates
    inputs:
      - intermediary_data/microdata/bfm_norep_pre
      - output/efftax
    outputs:
      - intermediary_data/microdata/bfm_norep_pre
      - intermediary_data/microdata/bfm_norep_pos

  - id: 04c-create-raw-postax-units
    country_scope: selected
    stage: taxes
    type: stata
    script: code/Stata/04c-create-raw-postax-units.do
    deps:
      - 04b-build-pretax-surveys
    inputs:
      - intermediary_data/microdata/bfm_norep_pre
    outputs:
      - intermediary_data/microdata/bfm_norep_pre

  - id: 05a-compare-sna-totals
    country_scope: shared
    stage: imputation
    type: stata
    script: code/Stata/05a-compare-sna-totals.do
    deps:
      - 01a-clean-macro-data
      - 04c-create-raw-postax-units
    inputs:
      - intermediary_data/national_accounts
      - intermediary_data/microdata
    outputs:
      - output/snacompare_summary

  - id: 05b-rescale-and-impute
    country_scope: selected
    stage: imputation
    type: stata
    script: code/Stata/05b-rescale-and-impute.do
    deps:
      - 05a-compare-sna-totals
    inputs:
      - intermediary_data/microdata
      - intermediary_data/national_accounts
    outputs:
      - intermediary_data/microdata/bfm_norep_pre

  - id: 05c-impute-pretax
    country_scope: selected
    stage: imputation
    type: stata
    script: code/Stata/05c-impute-pretax.do
    deps:
      - 05b-rescale-and-impute
      - 01g-add-public-spending-data
    inputs:
      - intermediary_data/microdata/bfm_norep_pre
    outputs:
      - intermediary_data/microdata/bfm_norep_pre

  - id: 05d-impute-posttax
    country_scope: selected
    stage: imputation
    type: stata
    script: code/Stata/05d-impute-posttax-disp-nat.do
    deps:
      - 05c-impute-pretax
    inputs:
      - intermediary_data/microdata/bfm_norep_pre
    outputs:
      - intermediary_data/microdata/bfm_norep_pre

  - id: 06a-run-ineqstats
    country_scope: selected
    stage: statistics
    type: stata
    script: code/Stata/06a-run-ineqstats.do
    deps:
      - 05d-impute-posttax
    inputs:
      - intermediary_data/microdata
    outputs:
      - output/ineqstats

  - id: 06b-graph-ineqstats-countries
    country_scope: selected
    stage: reporting
    type: stata
    script: code/Stata/06b-graph-ineqstats-countries-variables.do
    deps:
      - 06a-run-ineqstats
    inputs:
      - output/ineqstats
      - input_data/prices_WB/inflation_latam.dta
      - input_data/wid/prices_deflator_ppp_eur.dta
    outputs:
      - output/figures/ineqstats

  - id: 07a-export-synthetic-microfiles
    country_scope: selected
    stage: export
    type: stata
    script: code/Stata/07a-export-synthetic-microfiles.do
    deps:
      - 06a-run-ineqstats
    inputs:
      - output/ineqstats
      - input_data/wid/prices_deflator_ppp_eur.dta
    outputs:
      - output/synthetic_microfiles

  - id: 07b-report-data-availability
    country_scope: shared
    stage: validation
    type: stata
    script: code/Stata/07b-report_data_availability.do
    deps:
      - 07a-export-synthetic-microfiles
    inputs:
      - input_data
      - output
    outputs:
      - output/data_reports/latam_availability.xlsx

  - id: 07c-interpolate-ineqstats
    country_scope: selected
    stage: export
    type: stata
    script: code/Stata/07c-interpolate_ineqstats_results.do
    deps:
      - 07a-export-synthetic-microfiles
    inputs:
      - output/synthetic_microfiles
      - code/R/07c_interpolate_ineqstats.R
      - code/R/07c_run_interpolation.R
      - code/R/gpinter_precision.R
      - code/R/gpinter_thresholds.R
      - code/R/gpinter_tail_repair.R
      - code/R/gpinter_atoms.R
    outputs:
      - output/ineqstats/_gpinter_all_topcorrected.csv

  - id: 07d-export-results-to-wid
    country_scope: shared
    stage: export
    type: stata
    requirements:
      - configuration_validation
    script: code/Stata/07d-export-results-to-wid.do
    deps:
      - 07a-export-synthetic-microfiles
      - 07b-report-data-availability
      - 07c-interpolate-ineqstats
    inputs:
      - output/synthetic_microfiles
      - output/ineqstats/_gpinter_all_topcorrected.csv
      - output/data_reports/latam_availability.xlsx
      - code/R/07d_prepare_finished_dina.R
      - code/R/export-income-means.R
      - code/R/plot-disposable-comparisons.R
      - code/R/consistency_checker.R
      - code/R/export_publication_scope.R
      - code/R/source-diagnostics/finished_dina_publication.R
      - code/R/cli/finished_dina_publication.R
      - code/Stata/auxiliar/dina_finished_overlay.do
      - code/Stata/auxiliar/dina_export_comparison_aggregates.do
      - input_data/_new/previous_series
      - input_data/wid/population_total_adult_npopul.dta
      - input_data/wid/export_scaling_anninc_xrates.dta
      - input_data/wid/export_comparison_sptinc_p0p20.dta
    outputs:
      - output/latest_wid_series
