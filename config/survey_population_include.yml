version: 1
source_type: surveys
source_ids:
  - surveys-cepal
explore_output_root: output/experiments/survey_population_explore
output_root: output/experiments/survey_population_include
identity:
  # Configured country codes supplement canonical directory names when
  # inferring identities from non-standard incoming paths.
  countries_from_config: config/dina.yml
stata_read:
  # Haven auto-detection is always attempted first. These fallbacks are tried
  # in order for legacy Stata files whose metadata encoding is not declared.
  encoding_fallbacks:
    - latin1
review_focus:
  # The normal survey review follows the direct raw inputs consumed by the
  # active cleaner.  The Stata task carries the matching DINA_SURVEY_REVIEW_INPUTS
  # annotation; the explorer checks that the two declarations stay identical.
  task: 01e-clean-survey-data
  script: code/Stata/01e-clean-survey-data.do
  groups:
    - name: Records and weights
      variables:
        - _fep
        - edad
        - id_hogar
        - id_pers
        - sexo
    - name: Income components
      variables:
        - sys_pe
        - yoemp_pe
        - yjub_pe
        - gan_pe
        - ycap_pe
        - yotr_pe
        - yaim_he
        - yto_pe
        - yto_he
    - name: Household and work characteristics
      variables:
        - categ5_p
        - paren_ee
        - sector_ee
        - ramar_ee
        - tamest_ee
        - li
        - lp
        - pobreza
paths:
  canonical_surveys: input_data/surveys_CEPAL
  incoming_surveys: input_data/_new/surveys
  population: input_data/wid/population_total_adult_npopul.dta
  survey_pop: intermediary_data/population/SurveyPop.dta
