# Country-year trust regions for BFM.  These are methodological decisions,
# reviewed through `dina sources explore admin`, not raw administrative data.
#
# `publisher_derived` values use the first strictly-positive threshold after a
# zero-starting tax bracket. `explicit_policy` values are analyst choices.
# Historical source-derived decisions are retained but flagged when the old
# source release/threshold row was not preserved.
#
# The entries below migrate the applicable historical decisions from the
# retired directory.xlsx. New formatted country-years are deliberately absent:
# Admin Explore will propose a carry-forward value for an analyst to confirm.
version: 2
profiles:
  explicit_policy:
    basis: explicit_policy
    provenance_status: inferred_policy
    provenance_note: Repeated historical choice migrated from directory.xlsx; retained as an analyst policy.
  legacy_source_derived:
    basis: publisher_derived
    rule: first_positive_threshold
    provenance_status: legacy_unverified
    provenance_note: directory.xlsx retained the value but not the source release or threshold row; likely derived from the first positive threshold after the zero bracket.
country_field_profiles:
  ARG: {trust: legacy_source_derived, trust_wages: explicit_policy}
  BRA: {trust: explicit_policy}
  CRI: {trust: explicit_policy, trust_wages: legacy_source_derived}
  ECU: {trust: explicit_policy}
  CHL: {trust: legacy_source_derived, trust_wages: legacy_source_derived}
  COL: {trust: explicit_policy}
  DOM: {trust: explicit_policy}
  PER: {trust: explicit_policy}
  SLV: {trust: legacy_source_derived, trust_wages: legacy_source_derived}
  URY: {trust: explicit_policy}
  MEX: {trust: explicit_policy, trust_wages: explicit_policy}
overrides:
  - {country: BRA, year: 2002, trust_profile: legacy_source_derived}
  - {country: CHL, years: [2020, 2022], trust_profile: explicit_policy}
# `basis` fields on the migrated rows below are legacy values only. The
# country/field profiles above are the current classification authority.
