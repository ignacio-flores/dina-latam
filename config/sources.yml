    transformer: code/Stata/01g-add-public-spending-data.do
    checks:
      - file_exists
      - years_detected

  - id: surveys-cepal
    family: surveys
    country: MULTI
    method: manual
    canonical:
      - input_data/surveys_CEPAL/*/*.dta
      - input_data/surveys_CEPAL/_GENERAL_METADATA/*.xlsx
      - input_data/surveys_CEPAL/_COUNTRY_METADATA/*.xls
      - input_data/surveys_CEPAL/_COUNTRY_METADATA/*.xlsx
    staging_name: surveys/{date}
