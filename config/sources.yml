      - input_data/_new/sna/COL/*.xlsx
    destination: input_data/sna_country_data/COL/{basename}
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    notes: Colombia SNA website and legacy workbook links used for manual country-SNA refreshes.

  - id: country-sna-cri
