    family: dina
    country: ECU
    method: manual
    urls: []
    canonical:
      - input_data/dina/WIL_ECU_1990-2022_v2.dta
    prepared: input_data/dina/WIL_ECU_1990-2022_v2_prepared.dta
    inbox:
