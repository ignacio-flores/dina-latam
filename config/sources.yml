    inbox_examples:
      - WIL_ECU_1990-2022_v2.dta
    destination: input_data/dina/{basename}
    integration: prepared_external
    finished_series:
      version: v2
      first_year: 1990
      last_year: 2022
      steps: [nat, pon]
      units: [esn, ind]
      publication_step: nat
      publication_unit: esn
      publication_policy:
        continuation: four_group_relative_changes
        carry_forward: true
        include_history: true
        require_wid_scaling: true
      citation: "Nabernegg, M. (2026). Extreme Income Inequality in Ecuador-Dollarization, Commodity Price Boom, and Citizen Revolution."
      doi: ""
      currency: unconfirmed
      price_basis: unconfirmed
      population: unconfirmed
    notes: Researcher-supplied finished Ecuador distributions. Explore validates all supplied concepts and units independently of pipeline outputs; nat/esn is the publication series. Include preserves the byte-identical original and separately prepares the standard distribution with documented corrections. Publication approval is separate from source inclusion. Regular 07d exports consume approved prepared distributions and their reviewed continuation, apply the common WID income benchmark, and use the same approved distribution in regional donor calculations.

  - id: bra-morgan-souza-2026
    aliases:
      - bra-grouped-dina
    family: dina
    country: BRA
    method: manual
    urls: []
    canonical:
      - input_data/dina/MorganSouza2026-BR-wid.xlsx
    prepared: input_data/dina/MorganSouza2026-BR-wid_prepared.dta
    inbox:
      - input_data/_new/dina/MorganSouza2026-BR-wid.xlsx
    inbox_examples:
      - MorganSouza2026-BR-wid.xlsx
    destination: input_data/dina/{basename}
    integration: prepared_external
    finished_series:
      format: wid_grouped_xlsx
      version: "2026"
      first_year: 1926
      last_year: 2015
      prepared_step: nat
      prepared_unit: esn
      publication_step: nat
      publication_unit: esn
      publication_policy:
        status: hold
        hold_reason: "User requested scientific review before publication on 2026-10-24. Retain the supplied and prepared data; use the internal Brazil estimates in exports and regional calculations."
        continuation: four_group_relative_changes
        carry_forward: true
        include_history: true
        observation_years: accepted_prepared
        gini_kind: gpinter_fitted
        require_wid_scaling: true
      harmonization:
        first_full_year: 1976
        share_normalization: proportional
        require_full_population: true
        complete_partial_population: false
        interpolate_missing_years: false
        extrapolate_years: false
      percentiles: [p0p50, p50p90, p90p100, p99p100, p99.9p100, p99.99p100, p99.999p100]
      series:
        - sheet: BR-sptinc992j
          code: sptinc992j
          measure: share
          unit: fraction
        - sheet: BR-aptinc992j
          code: aptinc992j
          measure: average
          unit: 2016 prices
      citation: "Morgan and Souza (2026), supplied BRA workbook; full reference unconfirmed."
      doi: ""
      currency: unconfirmed
      price_basis: "2016 prices (as supplied); further monetary harmonization deferred"
      population: unconfirmed
    notes: Include preserves the original workbook and prepares only observed full-population years from 1976 onward. Publication retains accepted history, continues the last supplied distribution using internal four-group changes through the calculation year, and carries that shape into later export years. Historical gaps remain unfilled; publication approval and WID monetary scaling are separate from source inclusion.

