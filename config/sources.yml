      - input_data/_new/sna/PER/*.xlsx
    destination: input_data/sna_country_data/PER/{basename}
    transformer: code/Stata/01b-add-country-sna.do
    notes: Peru national accounts landing page used for manual country-SNA refreshes.

  - id: country-sna-ury
    family: country_sna
    country: URY
    method: manual
    urls:
      - label: landing page
        url: https://www.bcu.gub.uy/Estadisticas-e-Indicadores/Paginas/Cuentas-por-Sectores-Institucionales.aspx
    canonical:
