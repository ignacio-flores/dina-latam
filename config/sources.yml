      - label: IRPF monthly calculation reference
        url: https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/tributos/irpf-imposto-de-renda-pessoa-fisica#calculo_mensal_IRPF
    canonical:
      - input_data/admin_data/BRA/downloads/admin_thresholds.csv
    inbox:
      - input_data/_new/admin/BRA/admin_thresholds*.csv
    inbox_examples:
      - admin_thresholds.csv
    destination: input_data/admin_data/BRA/downloads/{basename}
    fetcher: code/R/manual-downloaders/fetch_bra_admin_thresholds.R
    fetch_target: input_data/_new/admin/BRA/admin_thresholds.csv
    transformer:
      - code/Stata/BRA/aux_bra_admin_thresholds.do
