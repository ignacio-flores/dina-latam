      - excel_readable
      - years_detected

  - id: balance-sheet-oecd
    family: balance_sheet
    country: BRA,COL,MEX
    method: manual
    canonical:
      - input_data/balance_sheet/OECD/balancesheets-br-col-mex.xls
    transformer: code/Stata/01a-clean-macro-data.do
    checks:
      - file_exists
      - excel_readable
      - years_detected

  - id: tax-composition-oecd-ciat-cepal
    family: tax_composition
    country: MULTI
    method: manual
    canonical:
      - input_data/OECD-CIAT-CEPAL/*.csv
    transformer: code/Stata/01c-import-tax-composition.do
    checks:
