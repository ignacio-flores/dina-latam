      - years_detected

  - id: previous-series
    family: validation
    country: MULTI
    method: manual
    canonical:
      - previous_series/*.dta
    staging_name: previous_series/{date}
    checks:
      - file_exists
    notes: Prior WID-format series used during final validation and export comparison.
