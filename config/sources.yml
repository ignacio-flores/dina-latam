sources:
  - id: chl-pit-total
    family: admin_tax
    country: CHL
    method: url
    url: https://www.sii.cl/sobre_el_sii/estadisticas/personas_naturales/PUB_Total.xlsb
    canonical:
      - input_data/admin_data/CHL/PUB_Total_*.xlsx
      - input_data/admin_data/CHL/PUB_Total_*.xlsb
    staging_name: CHL/PUB_Total_{date}.xlsb
    downloader: code/R/02c_clean_admin_chl.R
    transformer: code/R/02c_clean_admin_chl.R
    checks:
      - file_exists
      - excel_readable
      - years_detected
    notes: Chile PIT source. The cleaner is a pipeline transform; its update-mode download hook is not the preferred source workflow.

  - id: bra-admin-tax
    family: admin_tax
    country: BRA
    method: script
    urls:
      - label: Receita Federal dados abertos
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos
    canonical:
      - input_data/admin_data/BRA/gn-irpf-ac*.xlsx
      - input_data/admin_data/BRA/ptot_*.xlsx
      - input_data/admin_data/BRA/downloads/*
    staging_name: BRA/admin_tax_{date}
    downloader: code/R/manual-downloaders/bra_admin_downloader.R
    transformer: code/R/02c_clean_admin_bra.R
    checks:
      - file_exists
      - years_detected
    notes: Old acquisition helper downloads selected Receita Excel files. Keep canonical reviewed files under input_data/admin_data/BRA/.

  - id: bra-minwage
    family: admin_tax_aux
    country: BRA
    method: script
    url: https://es.wikipedia.org/wiki/Anexo:Salario_m%C3%ADnimo_en_Brasil
    canonical:
      - input_data/admin_data/BRA/downloads/wiki_minwage.csv
    staging_name: BRA/wiki_minwage_{date}.csv
    downloader: code/R/manual-downloaders/bra_minwage_downloader.R
    transformer: code/R/02c_clean_admin_bra.R
    checks:
      - file_exists
      - years_detected
    notes: Scrapes the minimum wage table used by the Brazil admin cleaner.

  - id: admin-tax-static
    family: admin_tax
    country: MULTI
    method: manual
    canonical:
      - input_data/admin_data/ARG
      - input_data/admin_data/COL
      - input_data/admin_data/DOM
      - input_data/admin_data/PER
      - input_data/admin_data/SLV
    checks:
      - file_exists
      - years_detected
    notes: Manually curated tax/admin inputs consumed by static and updated admin-data pipeline tasks.

  - id: un-sna
    family: macro_sna
    country: MULTI
    method: script
    urls:
      - label: UN Data SNA download handler
        url: http://data.un.org/Handlers/DownloadHandler.ashx
    canonical:
      - input_data/sna_UNDATA/*.csv.gz
      - input_data/sna_UNDATA/_clean/*.dta
      - input_data/sna_UNDATA/iso/iso-codes-dict.xlsx
      - input_data/sna_UNDATA/iso/iso_fullnames.csv
    staging_name: UN_SNA/{date}
    downloader: code/R/manual-downloaders/download-raw-un-sna.R
    transformer: code/R/01a_import-un-sna-data.R
    checks:
      - file_exists
      - years_detected
    notes: The legacy downloader builds UN SNA table URLs from table codes and years. The pipeline consumes the cleaned local DTA files.

  - id: country-sna-index
    family: country_sna
    country: MULTI
    method: manual
    canonical:
      - input_data/sna_country_data/_sna-web-site-index.ods
    urls:
      - country: ARG
        url: https://sitioanterior.indec.gob.ar/nivel3_default.asp?id_tema_1=3&id_tema_2=9
      - country: ARG
        url: https://www.indec.gob.ar/indec/web/Nivel3-Tema-3-9
      - country: CHL
        url: https://www.bcentral.cl/web/banco-central/areas/estadisticas
      - country: URY
        url: https://www.bcu.gub.uy/Estadisticas-e-Indicadores/Paginas/Cuentas-por-Sectores-Institucionales.aspx
      - country: BRA
        label: single-year downloads
        url: https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9052-sistema-de-contas-nacionais-brasil.html?=&t=downloads
      - country: BRA
        label: multi-year downloads
        url: https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9052-sistema-de-contas-nacionais-brasil.html?=&t=o-que-e
      - country: COL
        url: https://www.dane.gov.co/index.php/estadisticas-por-tema/cuentas-nacionales
      - country: ECU
        url: https://www.bce.fin.ec/informacioneconomica/sector-real
      - country: BOL
        url: https://www.ine.gob.bo/index.php/notas-de-prensa-y-monitoreo/itemlist/category/7-producto-interno-bruto-anual
      - country: PRY
        url: https://www.bcp.gov.py/cuentas-nacionales-anuales-i631
      - country: MEX
        url: https://www.inegi.org.mx/datos/?t=0190
      - country: PER
        url: https://www.inei.gob.pe/estadisticas/indice-tematico/national-accounts/
      - country: CRI
        url: https://www.bccr.fi.cr/seccion-cuentas-nacionales-periodo-2012/cuentas-nacionales-periodo-de-referencia-2012
      - country: DOM
        url: https://www.bancentral.gov.do/a/d/2533-sector-real
    checks:
      - file_exists
    notes: Curated ODS index of country SNA websites, coverage notes, and gaps. It is not an executable downloader.

  - id: country-sna-arg
    family: country_sna
    country: ARG
    method: manual
    canonical:
      - input_data/sna_country_data/ARG
    notes: Website is cataloged in country-sna-index; no canonical ARG country SNA folder is present in this checkout.

  - id: country-sna-bra
    family: country_sna
    country: BRA
    method: manual
    canonical:
      - input_data/sna_country_data/BRA/*.xls
      - input_data/sna_country_data/BRA/*.xlsx
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
      - excel_readable
      - years_detected
    notes: Brazil SNA website has multiple download modes; use country-sna-index before refreshing manually.

  - id: country-sna-chl
    family: country_sna
    country: CHL
    method: manual
    url: https://www.bcentral.cl/web/banco-central/areas/estadisticas
    canonical:
      - input_data/sna_country_data/CHL/*.xls
      - input_data/sna_country_data/CHL/*.xlsx
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
      - excel_readable
      - years_detected
    notes: Old downloader has a hard-coded historical URL; current source review should start from the website/index.

  - id: country-sna-col
    family: country_sna
    country: COL
    method: manual
    url: https://www.dane.gov.co/index.php/estadisticas-por-tema/cuentas-nacionales
    canonical:
      - input_data/sna_country_data/COL/*.xls
      - input_data/sna_country_data/COL/*.xlsx
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
      - excel_readable
      - years_detected

  - id: country-sna-cri
    family: country_sna
    country: CRI
    method: manual
    url: https://www.bccr.fi.cr/seccion-cuentas-nacionales-periodo-2012/cuentas-nacionales-periodo-de-referencia-2012
    canonical:
      - input_data/sna_country_data/CRI/*.xls
      - input_data/sna_country_data/CRI/*.xlsx
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
      - excel_readable
      - years_detected

  - id: country-sna-dom
    family: country_sna
    country: DOM
    method: manual
    url: https://www.bancentral.gov.do/a/d/2533-sector-real
    canonical:
      - input_data/sna_country_data/DOM/*.xls
      - input_data/sna_country_data/DOM/*.xlsx
    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
      - excel_readable
      - years_detected

  - id: country-sna-ecu
    family: country_sna
    country: ECU
    method: manual
    url: https://www.bce.fin.ec/informacioneconomica/sector-real
    canonical:
      - input_data/sna_country_data/ECU/*.xls
      - input_data/sna_country_data/ECU/*.xlsx
