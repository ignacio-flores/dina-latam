sources:
  - id: chl-pit-total
    family: admin_tax
    country: CHL
    method: url
    url: https://www.sii.cl/sobre_el_sii/estadisticas/personas_naturales/PUB_Total.xlsb
    urls:
      - label: landing page
        url: https://www.sii.cl/sobre_el_sii/estadisticas/personas_naturales
    canonical:
      - input_data/admin_data/CHL/PUB_Total_*.xlsx
      - input_data/admin_data/CHL/PUB_Total_*.xlsb
    inbox:
      - input_data/admin_data/CHL/_new/PUB_Total_*.xlsb
      - input_data/admin_data/CHL/_new/PUB_Total_*.xlsx
    destination: input_data/admin_data/CHL/{basename}
    staging_name: CHL/PUB_Total_{date}.xlsb
    downloader: code/R/02c_clean_admin_chl.R
    transformer: code/R/02c_clean_admin_chl.R
    checks:
      - file_exists
      - excel_readable
      - years_detected
    notes: Chile PIT source. The cleaner is a pipeline transform; its update-mode download hook is not the preferred source workflow.

  - id: bra-admin-tax
    family: admin_tax
    country: BRA
    method: script
    urls:
      - label: landing page
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos
      - label: script template direct file 2007-2013
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/estudos-e-tributarios-e-aduaneiros/estudos-e-estatisticas/11-08-2014-grandes-numeros-dirpf/gn-irpf-ac-{year}.xlsx
      - label: legacy direct file 2014
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/estudos-e-tributarios-e-aduaneiros/estudos-e-estatisticas/11-08-2014-grandes-numeros-dirpf/gn_irpf_ac2014.xlsx
      - label: legacy direct file 2015
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/estudos-e-tributarios-e-aduaneiros/estudos-e-estatisticas/11-08-2014-grandes-numeros-dirpf/tabelas-gn-irpf-ac-2015-excel.xlsx
      - label: legacy direct file 2016
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/estudos-e-tributarios-e-aduaneiros/estudos-e-estatisticas/11-08-2014-grandes-numeros-dirpf/estudo-gn-irpf-ac-2016-excel.xlsx
      - label: legacy direct file 2017
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/estudos-e-tributarios-e-aduaneiros/estudos-e-estatisticas/11-08-2014-grandes-numeros-dirpf/relatorio-gn-irpf-ac-2017-excel.xlsx
      - label: legacy direct file 2018
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/estudos-e-tributarios-e-aduaneiros/estudos-e-estatisticas/11-08-2014-grandes-numeros-dirpf/tabelas-gn-irpf-ac-2018-so-tabelas.xlsx
      - label: legacy direct file 2019
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/estudos-e-tributarios-e-aduaneiros/estudos-e-estatisticas/11-08-2014-grandes-numeros-dirpf/tabelas-irpf-ac2019-publicacao.xlsx
    canonical:
      - input_data/admin_data/BRA/gn-irpf-ac*.xlsx
      - input_data/admin_data/BRA/ptot_*.xlsx
    inbox:
      - input_data/admin_data/BRA/_new/gn-irpf-ac*.xlsx
    destination: input_data/admin_data/BRA/{basename}
    staging_name: BRA/admin_tax_{date}
    downloader: code/R/manual-downloaders/bra_admin_downloader.R
    transformer: code/R/02c_clean_admin_bra.R
    checks:
      - file_exists
      - years_detected
    notes: Old acquisition helper downloads selected Receita Excel files. Keep canonical reviewed files under input_data/admin_data/BRA/.

  - id: bra-minwage
    family: admin_tax_aux
    country: BRA
    method: script
    urls:
      - label: scraper page
        url: https://es.wikipedia.org/wiki/Anexo:Salario_m%C3%ADnimo_en_Brasil
      - label: reference
        url: http://www.guiatrabalhista.com.br/guia/salario_minimo.htm
    canonical:
      - input_data/admin_data/BRA/downloads/wiki_minwage.csv
    destination: input_data/admin_data/BRA/downloads/{basename}
    staging_name: BRA/wiki_minwage_{date}.csv
    downloader: code/R/manual-downloaders/bra_minwage_downloader.R
    transformer: code/R/02c_clean_admin_bra.R
    checks:
      - file_exists
      - years_detected
    notes: Scrapes the minimum wage table used by the Brazil admin cleaner.

  - id: bra-admin-thresholds
    family: admin_tax_aux
    country: BRA
    method: manual
    urls:
      - label: INSS historical contribution table
        url: https://www.gov.br/inss/pt-br/saiba-mais/seus-direitos-e-deveres/calculo-da-guia-da-previdencia-social-gps/tabela-de-contribuicao-mensal/tabela-de-contribuicao-historico
      - label: INSS current contribution table
        url: https://www.gov.br/inss/pt-br/direitos-e-deveres/inscricao-e-contribuicao/tabela-de-contribuicao-mensal
      - label: IRPF monthly calculation reference
        url: https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/tributos/irpf-imposto-de-renda-pessoa-fisica#calculo_mensal_IRPF
    transformer:
      - code/Stata/BRA/BRA_impute_socsec_contribs.do
      - code/Stata/BRA/svy_adj_BRA.do
    notes: Reference URLs for hard-coded Brazil social-security and IRPF thresholds used by adjustment scripts.

  - id: chl-uta
    family: admin_tax_aux
    country: CHL
    method: script
    urls:
      - label: SII UTM/UTA page template 2013+
        url: https://www.sii.cl/valores_y_fechas/utm/utm{year}.htm
      - label: SII UTM/UTA page template before 2013
        url: https://www.sii.cl/pagina/valores/utm/utm{year}.htm
    transformer: code/R/02c_clean_admin_chl.R
    notes: The Chile admin cleaner scrapes December UTA values while transforming PIT data; this should eventually become a staged local input.

  - id: admin-tax-static
    family: admin_tax
    country: ARG,DOM,PER,SLV
    method: manual
    canonical:
      - input_data/admin_data/ARG
      - input_data/admin_data/DOM
      - input_data/admin_data/PER
      - input_data/admin_data/SLV
    checks:
      - file_exists
      - years_detected
    notes: Manually curated tax/admin inputs consumed by static and updated admin-data pipeline tasks.

  - id: col-admin-income
    family: admin_tax
    country: COL
    method: manual
    urls:
      - label: DIAN Tributos page
        url: https://www.dian.gov.co/dian/cifras/Paginas/TributosDIAN.aspx
      - label: DIAN home
        url: http://www.dian.gov.co/
    canonical:
      - input_data/admin_data/COL/1_Cuantiles_Ingreso_Bruto_Naturales_2014-*
      - input_data/admin_data/COL/Nota-Metodologica-Cuantiles-Personas-Naturales.pdf
    inbox:
      - input_data/admin_data/COL/_new/1_Cuantiles_Ingreso_Bruto_Naturales_2014-*
    destination: input_data/admin_data/COL/{basename}
    transformer: code/Stata/tax-data/COL-diverse.do
    checks:
      - file_exists
      - excel_readable
      - years_detected
    notes: Colombia DIAN income quantile files. Local methodology PDF points to the DIAN Tributos page.

  - id: col-admin-wealth
    family: admin_tax
    country: COL
    method: manual
    urls:
      - label: DIAN Tributos page
        url: https://www.dian.gov.co/dian/cifras/Paginas/TributosDIAN.aspx
      - label: DIAN home
        url: http://www.dian.gov.co/
    canonical:
      - input_data/admin_data/COL/2_Cuantiles_Patrimonio_Bruto_Naturales_2014-*
      - input_data/admin_data/COL/Nota-Metodologica-Cuantiles-Personas-Naturales.pdf
    checks:
      - file_exists
      - excel_readable
      - years_detected
    notes: Colombia DIAN wealth quantile files. Cataloged separately because it is a distinct manual update target.

  - id: un-sna
    family: macro_sna
    country: MULTI
    method: script
    urls:
      - label: UN Data SNA download handler
        url: http://data.un.org/Handlers/DownloadHandler.ashx
    canonical:
      - input_data/sna_UNDATA/*.csv.gz
      - input_data/sna_UNDATA/_clean/*.dta
      - input_data/sna_UNDATA/iso/iso-codes-dict.xlsx
      - input_data/sna_UNDATA/iso/iso_fullnames.csv
    staging_name: UN_SNA/{date}
    downloader: code/R/manual-downloaders/download-raw-un-sna.R
    transformer: code/R/01a_import-un-sna-data.R
    checks:
      - file_exists
      - years_detected
    notes: The legacy downloader builds UN SNA table URLs from table codes and years. The pipeline consumes the cleaned local DTA files.

  - id: country-sna-index
    family: country_sna
    country: MULTI
    method: manual
    canonical:
      - input_data/sna_country_data/_sna-web-site-index.ods
    urls:
      - country: ARG
        url: https://sitioanterior.indec.gob.ar/nivel3_default.asp?id_tema_1=3&id_tema_2=9
      - country: ARG
        url: https://www.indec.gob.ar/indec/web/Nivel3-Tema-3-9
      - country: CHL
        url: https://www.bcentral.cl/web/banco-central/areas/estadisticas
      - country: URY
        url: https://www.bcu.gub.uy/Estadisticas-e-Indicadores/Paginas/Cuentas-por-Sectores-Institucionales.aspx
      - country: BRA
        label: single-year downloads
        url: https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9052-sistema-de-contas-nacionais-brasil.html?=&t=downloads
      - country: BRA
        label: multi-year downloads
        url: https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9052-sistema-de-contas-nacionais-brasil.html?=&t=o-que-e
      - country: COL
        url: https://www.dane.gov.co/index.php/estadisticas-por-tema/cuentas-nacionales
      - country: ECU
        url: https://www.bce.fin.ec/informacioneconomica/sector-real
      - country: BOL
        url: https://www.ine.gob.bo/index.php/notas-de-prensa-y-monitoreo/itemlist/category/7-producto-interno-bruto-anual
      - country: PRY
        url: https://www.bcp.gov.py/cuentas-nacionales-anuales-i631
      - country: MEX
        url: https://www.inegi.org.mx/datos/?t=0190
      - country: PER
        url: https://www.inei.gob.pe/estadisticas/indice-tematico/national-accounts/
      - country: CRI
        url: https://www.bccr.fi.cr/seccion-cuentas-nacionales-periodo-2012/cuentas-nacionales-periodo-de-referencia-2012
      - country: DOM
        url: https://www.bancentral.gov.do/a/d/2533-sector-real
    checks:
      - file_exists
    notes: Curated ODS index of country SNA websites, coverage notes, and gaps. It is not an executable downloader.

  - id: country-sna-arg
    family: country_sna
    country: ARG
    method: manual
    urls:
