    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
      - excel_readable
      - years_detected

  - id: country-sna-mex
    family: country_sna
    country: MEX
    method: zip
    url: https://www.inegi.org.mx/contenidos/temas/economia/cn/si/tabulados/ori/tabulados_si.zip
    canonical:
      - input_data/sna_country_data/MEX/CSI_*.xlsx
      - input_data/sna_country_data/MEX/indice_archivos.txt
    staging_name: MEX/tabulados_si_{date}.zip
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
      - excel_readable
      - years_detected
    notes: Current CLI stages the ZIP only; review and integration are still manual.

  - id: country-sna-per
    family: country_sna
    country: PER
    method: manual
    url: https://www.inei.gob.pe/estadisticas/indice-tematico/national-accounts/
    canonical:
      - input_data/sna_country_data/PER/*.xls
      - input_data/sna_country_data/PER/*.xlsx
    transformer: code/Stata/01b-add-country-sna.do
    checks:
      - file_exists
