sources:
  - id: chl-pit-total
    family: admin_tax
    country: CHL
    method: url
    url: https://www.sii.cl/sobre_el_sii/estadisticas/personas_naturales/PUB_Total.xlsb
    urls:
      - label: landing page
        url: https://www.sii.cl/sobre_el_sii/estadisticas/personas_naturales
    canonical:
      - input_data/admin_data/CHL/PUB_Total_*.xlsx
      - input_data/admin_data/CHL/PUB_Total_*.xlsb
    inbox:
      - input_data/_new/admin/CHL/PUB_Total_*.xlsb
      - input_data/_new/admin/CHL/PUB_Total_*.xlsx
    inbox_examples:
      - PUB_Total_2024.xlsb
      - PUB_Total_2024.xlsx
    destination: input_data/admin_data/CHL/{basename}
    downloader: code/R/02c_clean_admin_chl.R
    transformer: code/R/02c_clean_admin_chl.R
    notes: Chile PIT source. The cleaner is a pipeline transform; its update-mode download hook is not the preferred source workflow.

  - id: bra-pit-total
    family: admin_tax
    country: BRA
    method: script
    urls:
      - label: landing page
        url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos
    canonical:
      - input_data/admin_data/BRA/gn-irpf-ac*.xlsx
      - input_data/admin_data/BRA/ptot_*.xlsx
    inbox:
      - input_data/_new/admin/BRA/gn-irpf-ac*.xlsx
    inbox_examples:
      - gn-irpf-ac2024.xlsx
    destination: input_data/admin_data/BRA/{basename}
    downloader: code/R/manual-downloaders/bra_admin_downloader.R
    transformer: code/R/02c_clean_admin_bra.R
    notes: Old acquisition helper downloads selected Receita Excel files. Legacy direct files are not renewal targets; start current updates from the landing page.

  - id: bra-minwage
    family: admin_tax_aux
    country: BRA
    method: script
    urls:
      - label: scraper page
        url: https://es.wikipedia.org/wiki/Anexo:Salario_m%C3%ADnimo_en_Brasil
      - label: reference
        url: http://www.guiatrabalhista.com.br/guia/salario_minimo.htm
    canonical:
      - input_data/admin_data/BRA/downloads/wiki_minwage.csv
    inbox:
      - input_data/_new/admin/BRA/wiki_minwage*.csv
    inbox_examples:
      - wiki_minwage.csv
    destination: input_data/admin_data/BRA/downloads/{basename}
    downloader: code/R/manual-downloaders/bra_minwage_downloader.R
    fetcher: code/R/manual-downloaders/fetch_bra_minwage.R
    fetch_target: input_data/_new/admin/BRA/wiki_minwage.csv
    transformer: code/R/02c_clean_admin_bra.R
    notes: Scrapes the minimum wage table used by the Brazil admin cleaner.

  - id: bra-admin-thresholds
    family: admin_tax_aux
    country: BRA
    method: manual
    urls:
      - label: INSS historical contribution table
        url: https://www.gov.br/inss/pt-br/saiba-mais/seus-direitos-e-deveres/calculo-da-guia-da-previdencia-social-gps/tabela-de-contribuicao-mensal/tabela-de-contribuicao-historico
      - label: INSS current contribution table
        url: https://www.gov.br/inss/pt-br/direitos-e-deveres/inscricao-e-contribuicao/tabela-de-contribuicao-mensal
      - label: IRPF monthly calculation reference
        url: https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/tributos/irpf-imposto-de-renda-pessoa-fisica#calculo_mensal_IRPF
    transformer:
      - code/Stata/BRA/BRA_impute_socsec_contribs.do
      - code/Stata/BRA/svy_adj_BRA.do
    integration: none
    notes: Reference URLs for hard-coded Brazil social-security and IRPF thresholds used by adjustment scripts.

  - id: chl-uta
    family: admin_tax_aux
    country: CHL
    method: script
    urls:
      - label: SII UTM/UTA page template 2013+
        url: https://www.sii.cl/valores_y_fechas/utm/utm{year}.htm
      - label: SII UTM/UTA page template before 2013
        url: https://www.sii.cl/pagina/valores/utm/utm{year}.htm
    transformer: code/R/02c_clean_admin_chl.R
    integration: none
    notes: The Chile admin cleaner scrapes December UTA values while transforming PIT data; this should eventually become an explicit local input.

  - id: admin-tax-static
    family: admin_tax
    country: ARG,DOM,PER,SLV
    method: manual
    canonical:
      - input_data/admin_data/ARG
      - input_data/admin_data/DOM
      - input_data/admin_data/PER
      - input_data/admin_data/SLV
    integration: none
    notes: Manually curated tax/admin inputs consumed by static and updated admin-data pipeline tasks.

  - id: mex-admin-microdata
    family: admin_microdata
    country: MEX
    method: manual
    canonical:
      - input_data/admin_data/MEX
    destination: input_data/admin_data/MEX
    transformer: code/Stata/02b-prepare-admin-microdata.do
    notes: Heavy static Mexico admin microdata consumed by inactive task 02b; excluded from input compression by default.

  - id: ury-admin-microdata
    family: admin_microdata
    country: URY
    method: manual
    canonical:
      - input_data/admin_data/URY
    destination: input_data/admin_data/URY
    transformer: code/Stata/02b-prepare-admin-microdata.do
    notes: Heavy static Uruguay admin microdata consumed by inactive task 02b; excluded from input compression by default.

  - id: col-pit-total
    family: admin_tax
    country: COL
    method: manual
    urls:
      - label: DIAN Tributos page
        url: https://www.dian.gov.co/dian/cifras/Paginas/TributosDIAN.aspx
      - label: DIAN home
        url: http://www.dian.gov.co/
    canonical:
      - input_data/admin_data/COL/1_Cuantiles_Ingreso_Bruto_Naturales_2014-*
      - input_data/admin_data/COL/Nota-Metodologica-Cuantiles-Personas-Naturales.pdf
    inbox:
      - input_data/_new/admin/COL/1_Cuantiles_Ingreso_Bruto_Naturales_2014-*
    inbox_examples:
      - 1_Cuantiles_Ingreso_Bruto_Naturales_2014-2023
    destination: input_data/admin_data/COL/{basename}
    transformer: code/Stata/tax-data/COL-diverse.do
    notes: Colombia DIAN income quantile files. Local methodology PDF points to the DIAN Tributos page.

  - id: col-admin-wealth
    family: admin_tax
    country: COL
    method: manual
    urls:
      - label: DIAN Tributos page
        url: https://www.dian.gov.co/dian/cifras/Paginas/TributosDIAN.aspx
      - label: DIAN home
        url: http://www.dian.gov.co/
    canonical:
      - input_data/admin_data/COL/2_Cuantiles_Patrimonio_Bruto_Naturales_2014-*
      - input_data/admin_data/COL/Nota-Metodologica-Cuantiles-Personas-Naturales.pdf
    integration: none
    notes: Colombia DIAN wealth quantile files. Kept for historical reference; not an active renewal target.

  - id: un-sna
    family: macro_sna
    country: MULTI
    method: script
    urls:
      - label: UN Data SNA download handler
        url: http://data.un.org/Handlers/DownloadHandler.ashx
    canonical:
      - input_data/sna_UNDATA/*.csv.gz
      - input_data/sna_UNDATA/_clean/*.dta
      - input_data/sna_UNDATA/iso/iso-codes-dict.xlsx
      - input_data/sna_UNDATA/iso/iso_fullnames.csv
    downloader: code/R/manual-downloaders/download-raw-un-sna.R
    transformer: code/R/01a_import-un-sna-data.R
    integration: none
    notes: The legacy downloader builds UN SNA table URLs from table codes and years. The pipeline consumes the cleaned local DTA files.

  - id: country-sna-arg
    family: country_sna
    country: ARG
    method: manual
    urls:
      - label: legacy landing page
        url: https://sitioanterior.indec.gob.ar/nivel3_default.asp?id_tema_1=3&id_tema_2=9
      - label: landing page
        url: https://www.indec.gob.ar/indec/web/Nivel3-Tema-3-9
    canonical:
      - input_data/sna_country_data/ARG
    inbox:
      - input_data/_new/sna/ARG/*
    destination: input_data/sna_country_data/ARG/{basename}
    transformer: code/Stata/01b-add-country-sna.do
    notes: No canonical ARG country SNA folder is present in this checkout; use the listed website URLs for manual review.

  - id: country-sna-bra
    family: country_sna
    country: BRA
    method: manual
    urls:
      - label: landing page single-year downloads
        url: https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9052-sistema-de-contas-nacionais-brasil.html?=&t=downloads
      - label: landing page multi-year downloads
        url: https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9052-sistema-de-contas-nacionais-brasil.html?=&t=o-que-e
    canonical:
      - input_data/sna_country_data/BRA/*.xls
      - input_data/sna_country_data/BRA/*.xlsx
    inbox:
      - input_data/_new/sna/BRA/*.xls
      - input_data/_new/sna/BRA/*.xlsx
    destination: input_data/sna_country_data/BRA/{basename}
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    notes: Brazil SNA website has multiple download modes; start manual review from the listed landing pages.

  - id: country-sna-chl
    family: country_sna
    country: CHL
    method: manual
    urls:
      - label: landing page
        url: https://www.bcentral.cl/web/banco-central/areas/estadisticas
