  - id: country-sna-mex
    family: country_sna
    country: MEX
    method: zip
    url: https://www.inegi.org.mx/contenidos/temas/economia/cn/si/tabulados/ori/tabulados_si.zip
    urls:
      - label: landing page
        url: https://www.inegi.org.mx/datos/?t=0190
    canonical:
      - input_data/sna_country_data/MEX/CSI_*.xlsx
      - input_data/sna_country_data/MEX/indice_archivos.txt
    inbox:
      - input_data/_new/sna/MEX/*
    inbox_examples:
      - tabulados_si.zip
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    fetch_target: input_data/_new/sna/MEX/tabulados_si.zip
    integration: none
    notes: Fetches the ZIP into the SNA _new bucket; no automated source validation/preparation workflow is implemented yet.

  - id: country-sna-per
    family: country_sna
    country: PER
    method: manual
    urls:
      - label: landing page
        url: https://www.inei.gob.pe/estadisticas/indice-tematico/national-accounts/
    canonical:
      - input_data/sna_country_data/PER/*.xls
      - input_data/sna_country_data/PER/*.xlsx
    inbox:
