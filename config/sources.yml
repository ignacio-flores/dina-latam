  - id: country-sna-ven
    family: country_sna
    country: VEN
    method: manual
    canonical:
      - input_data/sna_country_data/VEN
    inbox:
      - input_data/_new/sna/VEN/*
    destination: input_data/sna_country_data/VEN/{basename}
    transformer: code/Stata/01b-add-country-sna.do
    notes: Local country SNA folder is present, but no active website entry was found in the current ODS index.

  - id: wid-macro
    family: wid
    country: MULTI
    method: wid
    urls:
      - label: WID data portal
        url: https://wid.world/
    canonical:
      - intermediary_data/national_accounts/UNDATA-WID-Merged.dta
      - intermediary_data/national_accounts/UNDATA-WID-OECD-Merged.dta
    transformer: code/Stata/01a-clean-macro-data.do
    integration: none
    notes: Stata `wid` calls in 01a fetch WID macro indicators used in national accounts construction.

  - id: wid-public-spending
    family: wid
    country: MULTI
    method: wid
    urls:
      - label: WID data portal
        url: https://wid.world/
    canonical:
      - input_data/sna-WID/gov_expenditure_*.dta
    transformer: code/Stata/01g-add-public-spending-data.do
    integration: none
    notes: 01g fetches WID public-spending indicators and merges them with local expenditure inputs.

  - id: wid-export-checks
    family: wid
    country: MULTI
    method: wid
    urls:
      - label: WID data portal
        url: https://wid.world/
    canonical:
      - output/latest_wid_series
    transformer: code/Stata/07d-export-results-to-wid.do
    integration: none
    notes: 07d calls WID for final export comparisons. This is an online pipeline dependency to make visible before moving it out.

  - id: wid-population-survey-adjustment
    family: wid
    country: ARG
    method: wid
    urls:
      - label: WID data portal
        url: https://wid.world/
    transformer: code/Stata/01f-adjust-country-survey-data.do
    integration: none
    notes: 01f has a targeted WID population call for Argentina survey adjustment.

  - id: wid-prices-xrates
    family: prices
    country: MULTI
    method: wid
    urls:
      - label: WID data portal
        url: https://wid.world/
    canonical:
      - input_data/prices_WID/infl_xrates_wid_wb.xlsx
    transformer:
      - code/Stata/06b-graph-ineqstats-countries-variables.do
      - code/Stata/06c-graph-ineqstats-by-step.do
      - code/Stata/07a-export-synthetic-microfiles.do
    integration: none
    notes: Several reporting/export tasks refresh this file through Stata `wid`; cataloged here as a side-effecting online dependency.

  - id: wb-xrates
    family: prices
    country: MULTI
    method: manual
    urls:
      - label: direct manual download
        url: https://api.worldbank.org/v2/en/indicator/PA.NUS.FCRF?downloadformat=excel
    canonical:
      - input_data/xrates_WB/wb-xrates.xls
    inbox:
      - input_data/_new/other/prices/wb-xrates.xls
      - input_data/_new/other/prices/API_PA.NUS.FCRF*.xls
      - input_data/_new/other/prices/API_PA.NUS.FCRF*.xlsx
    inbox_examples:
      - wb-xrates.xls
      - API_PA.NUS.FCRF_DS2_en_excel_v2_*.xls
    destination: input_data/xrates_WB/{basename}
    fetcher: code/R/manual-downloaders/fetch_wb_xrates.R
    fetch_target: input_data/_new/other/prices/wb-xrates.xls
    transformer: code/Stata/05b-rescale-and-impute.do
    notes: World Bank official exchange rates. Used for Ecuador old-currency harmonization.

  - id: wb-inflation
    family: prices
    country: MULTI
    method: manual
    urls:
      - label: direct manual download
        url: https://api.worldbank.org/v2/en/indicator/FP.CPI.TOTL.ZG?downloadformat=csv
    canonical:
      - input_data/prices_WB/inflation_latam.dta
      - input_data/prices_WB/old/inflation_latam.dta
    inbox:
      - input_data/_new/other/prices/inflation_latam.dta
    inbox_examples:
      - inflation_latam.dta
      - API_FP.CPI.TOTL.ZG_DS2_en_csv_v2_*.zip
    destination: input_data/prices_WB/{basename}
    fetcher: code/R/manual-downloaders/fetch_wb_inflation.R
    fetch_target: input_data/_new/other/prices/inflation_latam.dta
    transformer:
      - code/Stata/06b-graph-ineqstats-countries-variables.do
      - code/Stata/06c-graph-ineqstats-by-step.do
    notes: World Bank CPI inflation input, fetched into the other source bucket before price harmonization.

  - id: cepal-prices
    family: prices
    country: MULTI
    method: manual
    canonical:
      - input_data/prices_CEPAL/*.xlsx
    inbox:
      - input_data/_new/other/prices/*.xlsx
    destination: input_data/prices_CEPAL/{basename}
    transformer: code/Stata/05b-rescale-and-impute.do
    notes: Local CEPAL price inputs.

  - id: population
    family: wid
    country: MULTI
    method: wid
    urls:
      - label: WID data portal
        url: https://wid.world/
    canonical:
      - input_data/population/PopulationLatAm.dta
    inbox:
      - input_data/_new/other/population/PopulationLatAm.dta
    inbox_examples:
      - PopulationLatAm.dta
    destination: input_data/population/{basename}
    fetcher: code/R/manual-downloaders/fetch_wid_population.R
    fetch_target: input_data/_new/other/population/PopulationLatAm.dta
    transformer:
      - code/Stata/02b-prepare-admin-microdata.do
      - code/Stata/02c-prepare-static-admin-data.do
      - code/Stata/02d-prepare-updated-admin-data.do
      - code/Stata/07d-export-results-to-wid.do
    notes: WID npopul input for PopulationLatAm.dta. The fetcher uses age 999 as total population and age 992 as adult population, excludes French Guiana, Guadeloupe, and Martinique because WID has no npopul rows for them, and writes to _new for review before canonical promotion.

  - id: balance-sheet-imf
