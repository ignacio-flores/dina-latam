  - id: country-sna-ecu
    family: country_sna
    country: ECU
    method: manual
    urls:
      - label: landing page
        url: https://www.bce.fin.ec/informacioneconomica/sector-real
      - label: legacy direct file
        url: https://contenido.bce.fin.ec/documentos/PublicacionesNotas/Catalogo/CuentasNacionales/CEI2007-2019p.xlsx
      - label: legacy direct file
        url: https://contenido.bce.fin.ec/documentos/PublicacionesNotas/Catalogo/CuentasNacionales/ceinivel2sd.xlsx
