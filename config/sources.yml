    inbox:
      - input_data/_new/sna/CHL/*.xls
      - input_data/_new/sna/CHL/*.xlsx
    destination: input_data/sna_country_data/CHL/{basename}
    downloader: code/R/manual-downloaders/download-country-sna.R
    transformer: code/Stata/01b-add-country-sna.do
    notes: Old downloader has a hard-coded historical URL; current manual refresh should start from the website/index.

  - id: country-sna-col
    family: country_sna
    country: COL
    method: manual
    urls:
      - label: landing page
