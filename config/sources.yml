  - id: country-sna-mex
    family: country_sna
    country: MEX
    method: zip
    url: https://www.inegi.org.mx/contenidos/temas/economia/cn/si/tabulados/ori/tabulados_si.zip
    urls:
      - label: landing page
        url: https://www.inegi.org.mx/datos/?t=0190
    canonical:
      - input_data/sna_country_data/MEX/CSI_*.xlsx
      - input_data/sna_country_data/MEX/indice_archivos.txt
    inbox:
